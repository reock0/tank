name: Build Android APK v3.4 Full Upgrade

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-Upgrade to v3.4 (Custom Button Position/Size/Opacity + 21x15 Map + Crash Fix)
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/retro/battlecity

          # 1. Upgrade app/build.gradle to versionCode 7 (v3.4.0)
          if [ -f app/build.gradle ]; then
            sed -i 's/versionCode [0-9]\+/versionCode 7/g' app/build.gradle
            sed -i 's/versionName "[^"]*"/versionName "3.4.0"/g' app/build.gradle
          fi

          # 2. Write Crash-Free AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="FC坦克大战"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 3. Write Crash-Free MainActivity.java
          cat << 'EOF' > app/src/main/java/com/retro/battlecity/MainActivity.java
          package com.retro.battlecity;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      requestWindowFeature(Window.FEATURE_NO_TITLE);
                      getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_FULLSCREEN | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                      );
                  } catch (Throwable ignored) {}

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0f0f12"));
                  setContentView(webView);
                  enableImmersiveFullscreen();

                  try {
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);
                      settings.setLoadWithOverviewMode(true);
                      settings.setUseWideViewPort(true);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.JELLY_BEAN_MR1) {
                          settings.setMediaPlaybackRequiresUserGesture(false);
                      }
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  } catch (Throwable ignored) {}

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView != null) {
                      webView.evaluateJavascript(
                          "(window.onAndroidBackPressed && window.onAndroidBackPressed()) ? 'HANDLED' : 'EXIT'",
                          result -> {
                              if (result == null || !result.contains("HANDLED")) {
                                  finish();
                              }
                          }
                      );
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enableImmersiveFullscreen();
              }

              private void enableImmersiveFullscreen() {
                  try {
                      View decorView = getWindow().getDecorView();
                      if (decorView != null) {
                          decorView.setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                          );
                      }
                  } catch (Throwable ignored) {}
              }
          }
          EOF

          # 4. Patch index.html to v3.4 (Fix GRID_SIZE, Eagle Base & Add Drag-to-Reposition/Scale/Opacity Control Editor)
          python3 - << 'PYPATCH'
          import pathlib

          p = pathlib.Path("app/src/main/assets/index.html")
          if p.exists():
              s = p.read_text(encoding="utf-8")

              # Fix any residual GRID_SIZE references
              s = s.replace("for (let r = 0; r < GRID_SIZE; r++) {\n            for (let c = 0; c < GRID_SIZE; c++) {",
                            "for (let r = 0; r < GRID_H; r++) {\n            for (let c = 0; c < GRID_W; c++) {")
              s = s.replace("GRID_SIZE", "GRID_W")

              # Inject v3.4 Custom Touch Layout Editor (Position, Scale, Opacity + Viewport Clamping + LocalStorage)
              if "fc_battle_city_controls_v34" not in s:
                  v34_addon = """
                  <style>
                    .v34-drag-active {
                      outline: 2px dashed #38bdf8 !important;
                      outline-offset: 4px;
                      background: rgba(56, 189, 248, 0.16) !important;
                      cursor: move !important;
                      z-index: 60 !important;
                    }
                    .v34-drag-active * {
                      pointer-events: none !important;
                    }
                  </style>
                  <script>
                  (function(){
                    const STORAGE_KEY = 'fc_battle_city_controls_v34';
                    const DEFAULT_CFG = {
                      dpad: { x: null, y: null, scale: 100, opacity: 38 },
                      right: { x: null, y: null, scale: 100, opacity: 38 }
                    };
                    let cfg = JSON.parse(JSON.stringify(DEFAULT_CFG));
                    try {
                      const raw = localStorage.getItem(STORAGE_KEY);
                      if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && parsed.dpad && parsed.right) cfg = parsed;
                      }
                    } catch (e) {}

                    let editing = false;
                    let selected = 'dpad';

                    function saveCfg() {
                      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch (e) {}
                    }

                    function clampBox(el, key) {
                      const item = cfg[key];
                      if (!el || !item || item.x === null || item.y === null) return;
                      const rect = el.getBoundingClientRect();
                      const maxX = Math.max(4, window.innerWidth - rect.width - 4);
                      const maxY = Math.max(36, window.innerHeight - rect.height - 4);
                      item.x = Math.max(4, Math.min(maxX, item.x));
                      item.y = Math.max(36, Math.min(maxY, item.y));
                      el.style.left = Math.round(item.x) + 'px';
                      el.style.top = Math.round(item.y) + 'px';
                      el.style.right = 'auto';
                      el.style.bottom = 'auto';
                    }

                    function applyLayout() {
                      const dpadEl = document.getElementById('leftJoystickTouchZone');
                      const rightEl = document.getElementById('rightControlsWrap');
                      const dpadInner = document.getElementById('joystickBaseWrap');

                      if (dpadEl) {
                        dpadEl.style.transform = 'scale(' + (cfg.dpad.scale / 100).toFixed(2) + ')';
                        dpadEl.style.transformOrigin = 'center center';
                        if (cfg.dpad.x !== null && cfg.dpad.y !== null) {
                          clampBox(dpadEl, 'dpad');
                        } else {
                          dpadEl.style.left = ''; dpadEl.style.top = ''; dpadEl.style.right = ''; dpadEl.style.bottom = '';
                        }
                      }
                      if (dpadInner) {
                        dpadInner.style.opacity = (cfg.dpad.opacity / 100).toFixed(2);
                      }
                      if (rightEl) {
                        rightEl.style.transform = 'scale(' + (cfg.right.scale / 100).toFixed(2) + ')';
                        rightEl.style.transformOrigin = 'center center';
                        rightEl.style.opacity = (cfg.right.opacity / 100).toFixed(2);
                        if (cfg.right.x !== null && cfg.right.y !== null) {
                          clampBox(rightEl, 'right');
                        } else {
                          rightEl.style.left = ''; rightEl.style.top = ''; rightEl.style.right = ''; rightEl.style.bottom = '';
                        }
                      }
                    }

                    function bindDraggable(el, key) {
                      if (!el) return;
                      let dragging = false, sx = 0, sy = 0, sl = 0, st = 0;
                      const onStart = (cx, cy) => {
                        if (!editing) return;
                        dragging = true;
                        selected = key;
                        syncBarUI();
                        const rect = el.getBoundingClientRect();
                        sx = cx; sy = cy; sl = rect.left; st = rect.top;
                      };
                      const onMove = (cx, cy) => {
                        if (!dragging || !editing) return;
                        cfg[key].x = sl + (cx - sx);
                        cfg[key].y = st + (cy - sy);
                        clampBox(el, key);
                      };
                      const onEnd = () => {
                        if (dragging) { dragging = false; saveCfg(); }
                      };
                      el.addEventListener('mousedown', (e) => {
                        if (!editing) return;
                        e.preventDefault(); e.stopPropagation();
                        onStart(e.clientX, e.clientY);
                      });
                      window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
                      window.addEventListener('mouseup', onEnd);
                      el.addEventListener('touchstart', (e) => {
                        if (!editing) return;
                        e.preventDefault(); e.stopPropagation();
                        if (e.touches[0]) onStart(e.touches[0].clientX, e.touches[0].clientY);
                      }, { passive: false });
                      el.addEventListener('touchmove', (e) => {
                        if (!editing) return;
                        e.preventDefault(); e.stopPropagation();
                        if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
                      }, { passive: false });
                      el.addEventListener('touchend', (e) => {
                        if (!editing) return;
                        e.preventDefault(); onEnd();
                      }, { passive: false });
                    }

                    let barEl = null;
                    function syncBarUI() {
                      if (!barEl) return;
                      const item = cfg[selected];
                      barEl.querySelector('#v34TargetLbl').textContent = selected === 'dpad' ? '左侧方向键' : '右侧按键组';
                      barEl.querySelector('#v34ScaleInp').value = item.scale;
                      barEl.querySelector('#v34ScaleVal').textContent = item.scale + '%';
                      barEl.querySelector('#v34OpacInp').value = item.opacity;
                      barEl.querySelector('#v34OpacVal').textContent = item.opacity + '%';
                    }

                    function toggleEditor(forceState) {
                      editing = typeof forceState === 'boolean' ? forceState : !editing;
                      const dpadEl = document.getElementById('leftJoystickTouchZone');
                      const rightEl = document.getElementById('rightControlsWrap');
                      [dpadEl, rightEl].forEach(el => {
                        if (!el) return;
                        if (editing) el.classList.add('v34-drag-active');
                        else el.classList.remove('v34-drag-active');
                      });
                      if (barEl) barEl.style.display = editing ? 'flex' : 'none';
                      if (editing) syncBarUI();
                      else saveCfg();
                    }

                    window.addEventListener('DOMContentLoaded', () => {
                      const topHeader = document.getElementById('topHeader');
                      if (topHeader) {
                        const rightGroup = topHeader.lastElementChild;
                        if (rightGroup) {
                          const btn = document.createElement('button');
                          btn.type = 'button';
                          btn.textContent = '🎛️ 自定义按键';
                          btn.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold bg-cyan-700/90 text-white border border-cyan-300/40';
                          btn.onclick = () => toggleEditor();
                          rightGroup.insertBefore(btn, rightGroup.firstChild);
                        }
                      }

                      barEl = document.createElement('div');
                      barEl.style.cssText = 'display:none;position:fixed;top:40px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(12,10,9,0.95);border:2px solid #38bdf8;border-radius:14px;padding:6px 12px;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,0.75);';
                      barEl.innerHTML = `
                        <span style="color:#7dd3fc;font-weight:800;">🎛️ 拖动按键组调整位置 | <b id="v34TargetLbl">左侧方向键</b></span>
                        <label style="display:flex;align-items:center;gap:4px;">大小:<input id="v34ScaleInp" type="range" min="60" max="160" step="5" value="100" style="width:72px;"><span id="v34ScaleVal">100%</span></label>
                        <label style="display:flex;align-items:center;gap:4px;">透明度:<input id="v34OpacInp" type="range" min="15" max="100" step="1" value="38" style="width:72px;"><span id="v34OpacVal">38%</span></label>
                        <button id="v34ResetBtn" type="button" style="background:#9f1239;color:#fff;padding:3px 8px;border-radius:6px;font-weight:700;">恢复默认</button>
                        <button id="v34DoneBtn" type="button" style="background:#10b981;color:#052e16;padding:3px 10px;border-radius:6px;font-weight:800;">完成保存</button>
                      `;
                      document.body.appendChild(barEl);

                      barEl.querySelector('#v34ScaleInp').oninput = (e) => {
                        cfg[selected].scale = parseInt(e.target.value, 10) || 100;
                        syncBarUI(); applyLayout(); saveCfg();
                      };
                      barEl.querySelector('#v34OpacInp').oninput = (e) => {
                        cfg[selected].opacity = parseInt(e.target.value, 10) || 38;
                        syncBarUI(); applyLayout(); saveCfg();
                      };
                      barEl.querySelector('#v34ResetBtn').onclick = () => {
                        cfg = JSON.parse(JSON.stringify(DEFAULT_CFG));
                        saveCfg(); applyLayout(); syncBarUI();
                      };
                      barEl.querySelector('#v34DoneBtn').onclick = () => toggleEditor(false);

                      bindDraggable(document.getElementById('leftJoystickTouchZone'), 'dpad');
                      bindDraggable(document.getElementById('rightControlsWrap'), 'right');
                      window.addEventListener('resize', applyLayout);
                      applyLayout();
                    });
                  })();
                  </script>
                  """
                  s = s.replace("</body>", v34_addon + "\n</body>")

              p.write_text(s, encoding="utf-8")
              print("Successfully upgraded index.html to v3.4:", len(s), "bytes")
          PYPATCH

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FC-Battle-City-v3.4-Full-Upgrade-APK
          path: app/build/outputs/apk/debug/app-debug.apk
